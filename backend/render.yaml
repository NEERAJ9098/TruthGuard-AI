services:
  - type: web
    name: truthguard-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    plan: free
    rootDir: backend
